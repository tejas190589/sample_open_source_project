# Cppcheck configuration approximating MISRA mindset (no dynamic, safe constructs).
# Run via: cmake -S . -B build -DOSS_ENABLE_CPPCHECK=ON  (see CMakeLists.txt)
--enable=warning,style,performance,portability,information
--inconclusive
--std=c++17
--suppress=missingIncludeSystem
--suppress=unusedFunction
--language=c++
--force
include
src
tests
examples
